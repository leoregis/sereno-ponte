name: Ponte

# Testes e os dois APKs (produção e dev) em todo push; numa tag v<versão>,
# também a release com os APKs assinados com a chave da ponte e o
# versao.json que o site do Sereno publica em /ponte/.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ponte:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Versão (da tag)
        id: versao
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            nome="${GITHUB_REF#refs/tags/v}"
          else
            nome="0.0.0"
          fi
          IFS=. read -r a b c <<< "$nome"
          codigo=$(( a * 10000 + b * 100 + c ))
          if [ "$codigo" -lt 1 ]; then codigo=1; fi
          echo "nome=$nome" >> "$GITHUB_OUTPUT"
          echo "codigo=$codigo" >> "$GITHUB_OUTPUT"

      - name: Chave da ponte (dos segredos)
        if: github.event_name != 'pull_request'
        env:
          CHAVE: ${{ secrets.PONTE_KEYSTORE_B64 }}
        run: |
          if [ -n "$CHAVE" ]; then
            echo "$CHAVE" | base64 -d > "$RUNNER_TEMP/ponte.jks"
            echo "PONTE_KEYSTORE_ARQUIVO=$RUNNER_TEMP/ponte.jks" >> "$GITHUB_ENV"
          fi

      - name: Testes
        run: ./gradlew testProdDebugUnitTest --console=plain

      - name: APKs
        env:
          PONTE_KEYSTORE_SENHA: ${{ secrets.PONTE_KEYSTORE_SENHA }}
        run: >
          ./gradlew assembleProdRelease assembleDevRelease --console=plain
          -PversaoNome=${{ steps.versao.outputs.nome }}
          -PversaoCodigo=${{ steps.versao.outputs.codigo }}

      - name: Conferir a assinatura
        run: |
          # Uma versão estável das build-tools (a mais nova pode pedir outro Java).
          apksigner=""
          for v in 36.0.0 35.0.0 34.0.0; do
            if [ -x "$ANDROID_HOME/build-tools/$v/apksigner" ]; then apksigner="$ANDROID_HOME/build-tools/$v/apksigner"; break; fi
          done
          [ -n "$apksigner" ] || apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for f in app/build/outputs/apk/*/release/*.apk; do
            saida=$("$apksigner" verify --print-certs "$f" 2>&1) || { echo "$saida"; exit 1; }
            echo "$f"; echo "$saida" | grep -E "certificate (DN|SHA-256)"
            # Com a chave da ponte nos segredos, o APK tem de sair com ela.
            if [ -n "$PONTE_KEYSTORE_ARQUIVO" ]; then
              echo "$saida" | grep -q "CN=Sereno ponte" || { echo "assinado com outra chave"; exit 1; }
            fi
          done

      - name: Juntar os arquivos
        run: |
          mkdir -p saida
          cp app/build/outputs/apk/prod/release/app-prod-release.apk saida/sereno-ponte.apk
          cp app/build/outputs/apk/dev/release/app-dev-release.apk saida/sereno-ponte-dev.apk
          printf '{"versao":"%s","codigo":%s}\n' "${{ steps.versao.outputs.nome }}" "${{ steps.versao.outputs.codigo }}" > saida/versao.json
          sha256sum saida/*

      - uses: actions/upload-artifact@v4
        with:
          name: ponte-${{ steps.versao.outputs.nome }}
          path: saida/

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" saida/sereno-ponte.apk saida/sereno-ponte-dev.apk saida/versao.json \
            --title "Ponte ${{ steps.versao.outputs.nome }}" \
            --notes "APKs da ponte (produção e dev) e o versao.json. O site do Sereno publica em /ponte/."
